# KRaft mode, single broker, no ZooKeeper — this chart version (32.4.3) has
# no top-level `kraft` key; ZooKeeper support was removed entirely and KRaft
# is the only supported mode, so no key is needed to enable it.

image:
  repository: bitnamilegacy/kafka

global:
  security:
    allowInsecureImages: true

controller:
  replicaCount: 1

broker:
  replicaCount: 0

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  external:
    protocol: PLAINTEXT

# externalAccess.controller.service.domain (the advertised address for
# the external listener) is set at install time via `--set` in
# bootstrap.sh, using the Elastic IP (not known here).
externalAccess:
  enabled: true
  controller:
    service:
      type: NodePort
      nodePorts:
        - "9094"

# Kafka configuration for single-broker cluster
# Single broker requires replication factor 1 for internal topics or consumers hang
overrideConfiguration:
  log.retention.hours: "24"
  offsets.topic.replication.factor: "1"
  transaction.state.log.replication.factor: "1"
  transaction.state.log.min.isr: "1"

# Value paths above were validated against bitnami/kafka chart 32.4.3
# (app version 4.0.0), which is the version pinned via --version in
# bootstrap.sh. If that pin is ever bumped, re-check these field names
# with `helm show values bitnami/kafka --version <new-version>` first —
# Bitnami has changed value paths across versions before (that's how
# `advertisedHost` and `autoDiscovery.enabled` ended up as silent no-ops
# here, fixed in the final review pass).
