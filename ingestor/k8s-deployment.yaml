# Source ships as ConfigMaps (see deploy.sh): weatherops-lib is the shared
# package, ingestor-code this service. The stock python image pip-installs
# its one dependency at start.
#
# Re-applying this manifest resets the mode to live. Switch modes with
#   ./deploy.sh --replay <event> | --sim <scenario> | --live
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ingestor
  namespace: weather-pipeline
  labels:
    app: weather-ingestor
spec:
  replicas: 1
  strategy:
    # Two ingestors would emit every reading twice under the same seq.
    type: Recreate
  selector:
    matchLabels:
      app: weather-ingestor
  template:
    metadata:
      labels:
        app: weather-ingestor
    spec:
      containers:
        - name: ingestor
          image: python:3.12-slim
          # ponytail: pip at start costs ~10 s per restart and needs network;
          # bake an image if restarts ever need to be instant.
          command: ["sh", "-c"]
          args:
            - pip install --quiet --no-cache-dir kafka-python-ng==2.2.3 && exec python -m ingestor.main
          workingDir: /app/svc
          env:
            - name: PYTHONPATH
              value: /app/lib:/app/svc
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MODE
              value: live
            - name: SCENARIO
              value: ""
            - name: REPLAY_SPEED
              value: ""
            - name: FAULT_RATE
              value: "0.25"
          volumeMounts:
            - name: lib
              mountPath: /app/lib/weatherops
            - name: code
              mountPath: /app/svc/ingestor
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
      volumes:
        - name: lib
          configMap:
            name: weatherops-lib
        - name: code
          configMap:
            name: ingestor-code
