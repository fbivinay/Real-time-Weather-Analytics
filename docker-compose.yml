# Local pipeline for development and smoke tests - no AWS, no k3s.
# Same code, same images as the cluster; S3 sinks are skipped (no bucket).
#
#   docker compose up -d                      # sim storm over Chennai
#   MODE=live docker compose up -d ingestor   # real Open-Meteo data
#   docker compose down -v
#
# API on http://localhost:8000 (snapshot, WebSocket /ws) once the engine runs.
name: weatherops

x-python: &python
  image: python:3.12-slim
  working_dir: /repo
  volumes: [".:/repo:ro"]
  environment: &pyenv
    PYTHONPATH: /repo
    PYTHONUNBUFFERED: "1"
    KAFKA_BOOTSTRAP: kafka:9092
    REDIS_HOST: redis
    REDIS_PASSWORD: localpw
  depends_on:
    topics:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      retries: 20

  topics:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        for t in weather-data weather-quarantine weather-features weather-decisions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 1 --replication-factor 1 --config retention.ms=86400000
        done

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "localpw"]

  ingestor:
    <<: *python
    environment:
      <<: *pyenv
      MODE: ${MODE:-sim}
      SCENARIO: ${SCENARIO:-storm-chennai}
      REPLAY_SPEED: ${REPLAY_SPEED:-}
      FAULT_RATE: ${FAULT_RATE:-1.0}
    command: ["sh", "-c", "pip install -q kafka-python-ng==2.2.3 && exec python -m ingestor.main"]

  processor:
    image: apache/spark:3.5.3-python3
    user: "0"
    working_dir: /repo
    volumes: [".:/repo:ro"]
    environment:
      <<: *pyenv
      PYTHONPATH: /repo:/tmp/pydeps
      CHECKPOINT_ROOT: /tmp/checkpoints
    depends_on:
      topics:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - >-
        pip install -q --target /tmp/pydeps redis==5.2.1 &&
        exec /opt/spark/bin/spark-submit --master "local[*]" --driver-memory 1g
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
        --conf spark.jars.ivy=/tmp/ivy /repo/spark_processor/streaming_job.py

  engine:
    <<: *python
    command:
      - sh
      - -c
      - >-
        apt-get update -qq && apt-get install -y -qq --no-install-recommends libgomp1 >/dev/null &&
        pip install -q kafka-python-ng==2.2.3 redis==5.2.1 lightgbm==4.6.0 numpy==2.2.6 &&
        exec python -m serving.engine
