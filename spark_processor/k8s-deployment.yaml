# The job's Python ships as ConfigMaps built from the real source files (see
# deploy.sh): weatherops-lib is the shared package, weather-processor-code
# this job. No image to build or push.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-checkpoints
  namespace: weather-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-processor
  namespace: weather-pipeline
  labels:
    app: weather-processor
spec:
  replicas: 1
  strategy:
    # The checkpoint PVC is ReadWriteOnce and Spark checkpoints tolerate exactly
    # one writer, so the old pod must go before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      app: weather-processor
  template:
    metadata:
      labels:
        app: weather-processor
    spec:
      securityContext:
        # Stock Spark image runs as uid 185; it must own the checkpoint volume.
        fsGroup: 185
      containers:
        - name: weather-processor
          image: apache/spark:3.5.3-python3
          imagePullPolicy: IfNotPresent
          # redis (for the progress listener) is the job's only Python
          # dependency; the image's site-packages is not writable by uid 185.
          # The Postgres JDBC driver comes in through --packages.
          command: ["sh", "-c"]
          args:
            - >-
              pip install --quiet --no-cache-dir --target /tmp/pydeps redis==5.2.1 &&
              exec /opt/spark/bin/spark-submit
              --master "local[*]"
              --driver-memory 1200m
              --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4,org.postgresql:postgresql:42.7.4
              --conf spark.jars.ivy=/checkpoints/.ivy2
              /app/svc/spark_processor/streaming_job.py
          env:
            - name: PYTHONPATH
              value: "/app/svc:/app/lib:/tmp/pydeps"
            - name: S3_BUCKET
              value: "weather-pipeline-021448121627"
            - name: CHECKPOINT_ROOT
              value: "/checkpoints/shopflow"
            - name: PGHOST
              value: postgres.weather-pipeline.svc.cluster.local
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-auth
                  key: password
            - name: REDIS_HOST
              value: "redis-master.weather-pipeline.svc.cluster.local"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-s3-creds
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-s3-creds
                  key: secret-access-key
          volumeMounts:
            - name: lib
              mountPath: /app/lib/weatherops
            - name: code
              mountPath: /app/svc/spark_processor
            - name: checkpoints
              mountPath: /checkpoints
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
      volumes:
        - name: lib
          configMap:
            name: weatherops-lib
        - name: code
          configMap:
            name: weather-processor-code
        - name: checkpoints
          persistentVolumeClaim:
            claimName: spark-checkpoints
