# Engine and API ship as ConfigMaps built from the real source files (see
# deploy.sh): weatherops-lib is the shared package, serving-code this
# directory. The replayed rainfall comes from the node's data directory.
# Both run on the stock python image and pip-install at start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-engine
  namespace: weather-pipeline
  labels:
    app: weather-engine
spec:
  replicas: 1
  strategy:
    # Live operations state lives in this process; two engines would roll
    # the same deliveries into history twice.
    type: Recreate
  selector:
    matchLabels:
      app: weather-engine
  template:
    metadata:
      labels:
        app: weather-engine
    spec:
      containers:
        - name: engine
          image: python:3.12-slim
          # ponytail: pip at start costs ~30 s per restart; bake an image if
          # restarts ever need to be fast.
          command: ["sh", "-c"]
          args:
            - >-
              pip install --quiet --no-cache-dir kafka-python-ng==2.2.3 redis==5.2.1 numpy==2.2.6
              "psycopg[binary]==3.2.10" &&
              exec python -m serving.engine
          workingDir: /app/svc
          env:
            - name: PYTHONPATH
              value: /app/lib:/app/svc
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATA_DIR
              value: /app/data
            - name: PGHOST
              value: postgres.weather-pipeline.svc.cluster.local
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-auth
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          volumeMounts:
            - name: lib
              mountPath: /app/lib/weatherops
            - name: code
              mountPath: /app/svc/serving
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "1536Mi"
      volumes:
        - name: lib
          configMap:
            name: weatherops-lib
        - name: code
          configMap:
            name: serving-code
        - name: data
          hostPath:
            path: /home/ubuntu/weatherops-data
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  namespace: weather-pipeline
  labels:
    app: weather-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - >-
              pip install --quiet --no-cache-dir redis==5.2.1 fastapi==0.115.12 "uvicorn[standard]==0.34.2"
              numpy==2.2.6 "psycopg[binary]==3.2.10" &&
              exec uvicorn --factory serving.api:app --host 0.0.0.0 --port 8000 --app-dir /app/svc
          workingDir: /app/svc
          env:
            - name: PYTHONPATH
              value: /app/lib:/app/svc
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATA_DIR
              value: /app/data
            - name: PGHOST
              value: postgres.weather-pipeline.svc.cluster.local
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-auth
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            # Generous delay: the container installs its dependencies before
            # uvicorn binds, so an eager probe would fail the pod during pip.
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: lib
              mountPath: /app/lib/weatherops
            - name: code
              mountPath: /app/svc/serving
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "160Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: lib
          configMap:
            name: weatherops-lib
        - name: code
          configMap:
            name: serving-code
        - name: data
          hostPath:
            path: /home/ubuntu/weatherops-data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: weather-api
  namespace: weather-pipeline
spec:
  # Reached through the Traefik ingress (serving/ingress.yaml), or an SSH
  # tunnel (./deploy.sh --tunnel).
  type: ClusterIP
  selector:
    app: weather-api
  ports:
    - name: http
      port: 8000
      targetPort: http
