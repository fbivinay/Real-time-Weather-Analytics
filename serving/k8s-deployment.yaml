# Engine and API ship as ConfigMaps built from the real source files (see
# deploy.sh): weatherops-lib is the shared package, serving-code this
# directory, engine-models the trained forecast models (optional). Both run
# on the stock python image and pip-install their dependencies at start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-engine
  namespace: weather-pipeline
  labels:
    app: weather-engine
spec:
  replicas: 1
  strategy:
    # Incidents live in this process; two engines would open them twice.
    type: Recreate
  selector:
    matchLabels:
      app: weather-engine
  template:
    metadata:
      labels:
        app: weather-engine
    spec:
      containers:
        - name: engine
          image: python:3.12-slim
          # ponytail: apt + pip at start costs ~30 s per restart; bake an
          # image if restarts ever need to be fast. LightGBM needs OpenMP
          # (libgomp1), which the slim image lacks.
          command: ["sh", "-c"]
          args:
            - >-
              apt-get update -qq && apt-get install -y -qq --no-install-recommends libgomp1 >/dev/null &&
              pip install --quiet --no-cache-dir kafka-python-ng==2.2.3 redis==5.2.1 lightgbm==4.6.0 numpy==2.2.6 &&
              exec python -m serving.engine
          workingDir: /app/svc
          env:
            - name: PYTHONPATH
              value: /app/lib:/app/svc
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MODELS_DIR
              value: /app/models
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          volumeMounts:
            - name: lib
              mountPath: /app/lib/weatherops
            - name: code
              mountPath: /app/svc/serving
            - name: models
              mountPath: /app/models
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
      volumes:
        - name: lib
          configMap:
            name: weatherops-lib
        - name: code
          configMap:
            name: serving-code
        - name: models
          configMap:
            name: engine-models
            optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  namespace: weather-pipeline
  labels:
    app: weather-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - >-
              pip install --quiet --no-cache-dir redis==5.2.1 fastapi==0.115.12 "uvicorn[standard]==0.34.2" &&
              exec uvicorn serving.api:app --host 0.0.0.0 --port 8000 --app-dir /app/svc
          workingDir: /app/svc
          env:
            - name: PYTHONPATH
              value: /app/lib:/app/svc
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            # Generous delay: the container installs its dependencies before
            # uvicorn binds, so an eager probe would fail the pod during pip.
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: lib
              mountPath: /app/lib/weatherops
            - name: code
              mountPath: /app/svc/serving
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
      volumes:
        - name: lib
          configMap:
            name: weatherops-lib
        - name: code
          configMap:
            name: serving-code
---
apiVersion: v1
kind: Service
metadata:
  name: weather-api
  namespace: weather-pipeline
spec:
  type: NodePort
  selector:
    app: weather-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
