# consumer.py and api.py ship as a ConfigMap built from the real source files
# (see deploy.sh), so there is no image to build or push. Both run on the stock
# python image and pip-install their handful of deps at startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-consumer
  namespace: weather-pipeline
  labels:
    app: weather-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-consumer
  template:
    metadata:
      labels:
        app: weather-consumer
    spec:
      containers:
        - name: consumer
          image: python:3.12-slim
          # ponytail: pip at startup costs ~20s per restart and needs the
          # network. Fine here because Docker Desktop is unavailable to build
          # an image; bake a real image if restarts ever need to be fast.
          command: ["sh", "-c"]
          args:
            - pip install --quiet --no-cache-dir redis kafka-python-ng && python /app/consumer.py
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
      volumes:
        - name: code
          configMap:
            name: weather-serving-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  namespace: weather-pipeline
  labels:
    app: weather-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install --quiet --no-cache-dir redis fastapi uvicorn && uvicorn api:app --host 0.0.0.0 --port 8000 --app-dir /app
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            # Generous delay: the container installs its dependencies before
            # uvicorn binds, so an eager probe would fail the pod during pip.
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
      volumes:
        - name: code
          configMap:
            name: weather-serving-code
---
apiVersion: v1
kind: Service
metadata:
  name: weather-api
  namespace: weather-pipeline
spec:
  type: NodePort
  selector:
    app: weather-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
